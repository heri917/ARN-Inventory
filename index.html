<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ARN Inventory">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" href="./arn-inventory-icon.png">
  <title>ARN Inventory • Stok & Part</title>
  <style>
    :root{--black:#090909;--gold:#c9a24a;--white:#fff;--muted:#8f8f8f;--line:#242424;--bg:#f5f5f3}
    *{box-sizing:border-box}html,body,#app{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{background:var(--bg);color:#111}.splash{position:fixed;inset:0;background:#090909;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;padding:24px}
    .loading-logo{width:min(38vw,150px);height:auto;object-fit:contain}.bar{width:min(78vw,330px);height:5px;background:#292929;border-radius:99px;position:relative;margin-top:34px;overflow:visible}.bar-fill{height:100%;width:0;background:var(--gold);border-radius:99px}.box{position:absolute;left:0;top:50%;width:17px;height:17px;border:2px solid var(--gold);background:#111;transform:translate(-50%,-50%) rotate(0deg);animation:none;box-shadow:0 0 10px #c9a24a55}.box.roll{animation:roll 7s linear forwards}@keyframes roll{0%{left:0;transform:translate(-50%,-50%) rotate(0deg)}100%{left:100%;transform:translate(-50%,-50%) rotate(720deg)}}.by{margin-top:58px;font-size:12px;letter-spacing:.12em;color:#aaa}.dev-logo{width:66px;height:66px;object-fit:contain;margin-top:8px}.shell{min-height:100vh;padding-bottom:82px}.header{height:76px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:#090909;display:flex;align-items:center;justify-content:space-between}.header-logo{height:40px;max-width:230px;object-fit:contain}.menu{border:0;background:none;color:white;font-size:28px;line-height:1;padding:6px}.page{padding:18px 16px}.card{background:#fff;border:1px solid #e6e6e6;border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 4px 16px #00000008}.muted{color:var(--muted)}.bottom{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;z-index:20}.navbtn{border:0;background:none;display:flex;flex-direction:column;gap:3px;align-items:center;font-size:12px;color:#777}.navbtn.active{color:#111;font-weight:700}.drawer{position:fixed;top:0;right:0;bottom:0;width:min(86vw,360px);background:#fff;z-index:50;transform:translateX(100%);transition:.2s;padding:calc(env(safe-area-inset-top) + 18px) 18px 18px;box-shadow:-10px 0 30px #0003}.drawer.open{transform:translateX(0)}.overlay{position:fixed;inset:0;background:#0006;z-index:45;display:none}.overlay.open{display:block}.drawer h2{margin:0 0 18px}.item{width:100%;text-align:left;padding:14px;border:0;background:none;border-radius:12px;font-size:15px}.item:hover{background:#f4f4f4}.logout{margin-top:auto;color:#a00;border-top:1px solid #eee}.empty{text-align:center;padding:44px 12px}.gold{color:var(--gold)}
  </style>
</head>
<body>
<div id="app"></div>
<script>
const APP={name:"ARN Inventory",subtitle:"Stok & Part",minSplash:7000};
const state={page:"Stok",drawer:false,started:Date.now()};
const $=s=>document.querySelector(s);
function render(){
  const nav=["Stok","History","Ringkasan"];
  const content = state.page==="Stok" ? `<div class="card empty"><h2>Stok</h2><p class="muted">Kelola stok dan part di sini.</p></div>`
  : state.page==="History" ? `<div class="card empty"><h2>History</h2><p class="muted">Riwayat transaksi stok akan tampil di sini.</p></div>`
  : `<div class="card empty"><h2>Ringkasan</h2><p class="muted">Ringkasan stok dan aktivitas akan tampil di sini.</p></div>`;
  $("#app").innerHTML=`<div class="shell">
    <header class="header"><img class="header-logo" src="./arn-inventory-header.png" alt="ARN Inventory"><button class="menu" aria-label="Menu">☰</button></header>
    <main class="page">${content}</main>
    <nav class="bottom">${nav.map(n=>`<button class="navbtn ${state.page===n?"active":""}" data-nav="${n}"><span>${n==="Stok"?"▣":n==="History"?"◷":"▤"}</span><span>${n}</span></button>`).join("")}</nav>
    <div class="overlay"></div><aside class="drawer"><h2>Menu</h2>
      ${["Refresh Data","Kelola Kategori","Kelola Part","Backup / Ekspor","Pengaturan","Tentang Aplikasi","Lisensi"].map(x=>`<button class="item">${x}</button>`).join("")}
      <button class="item logout">Keluar Akun</button>
    </aside>
  </div>`;
  document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{state.page=b.dataset.nav;render()});
  $(".menu").onclick=()=>{state.drawer=true;$(".drawer").classList.add("open");$(".overlay").classList.add("open")};
  $(".overlay").onclick=closeDrawer;
}
function closeDrawer(){state.drawer=false;$(".drawer").classList.remove("open");$(".overlay").classList.remove("open")}
function splash(){
 const s=document.createElement("div");s.className="splash";s.innerHTML=`<img class="loading-logo" src="./arn-loading-logo.png" alt="ARN Inventory"><div class="bar"><div class="bar-fill"></div><div class="box"></div></div><div class="by">By</div><img class="dev-logo" src="./arn-solutions.png" alt="ARN Solutions">`;document.body.appendChild(s);
 requestAnimationFrame(()=>{s.querySelector(".box").classList.add("roll");s.querySelector(".bar-fill").animate([{width:"0%"},{width:"100%"}],{duration:7000,fill:"forwards",easing:"linear"})});
 setTimeout(()=>{s.remove();render()},7000);
}
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
splash();
</script>
</body>
</html>
